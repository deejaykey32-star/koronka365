<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jezu, ufam Tobie – Koronka i Różaniec</title>
<meta name="description" content="Koronka do Miłosierdzia Bożego i Różaniec na tle obrazu Jezusa Miłosiernego. Lektor, muzyka, tryb automatyczny.">
<meta name="theme-color" content="#1f1718">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#1f1718;            /* kolor tła obrazu – tło za obrazem */
  --blood:#c8323c; --gold:#d9b25a;
  --ink:#f2ecea; --ink-2:#b9adab; --panel:rgba(44,33,34,.92); --line:rgba(242,236,234,.14);
  --btn:#3a2c2d; --btn-ink:#f2ecea;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --ink:#241a1b; --ink-2:#5d5050; --panel:rgba(250,246,244,.95); --line:rgba(36,26,27,.14); --btn:#ebe3e1; --btn-ink:#241a1b;
}}
:root[data-theme="light"]{ --ink:#241a1b; --ink-2:#5d5050; --panel:rgba(250,246,244,.95); --line:rgba(36,26,27,.14); --btn:#ebe3e1; --btn-ink:#241a1b; }
:root[data-theme="dark"]{ --ink:#f2ecea; --ink-2:#b9adab; --panel:rgba(44,33,34,.92); --line:rgba(242,236,234,.14); --btn:#3a2c2d; --btn-ink:#f2ecea; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--canvas)}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:#f2ecea;font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- układ: pion (domyślny) ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"head" "stage" "cap" "ctrl"}
header{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px 6px}
.stage{grid-area:stage;position:relative;min-height:0;min-width:0;background:var(--canvas);overflow:hidden;touch-action:pan-y}
.caption{grid-area:cap;margin:6px 10px 0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px 12px;max-height:24vh;overflow:auto}
.controls{grid-area:ctrl;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px 10px}

.brand{font-family:var(--serif);font-style:italic;font-size:1.2rem;margin-right:auto;white-space:nowrap;color:#f2ecea;min-width:0;flex:1 1 0;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:rgba(242,236,234,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:999px;color:#f2ecea;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1b1a14}
.parts{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none}
.parts[hidden]{display:none}
.parts button{flex:0 0 auto;border:1px solid rgba(242,236,234,.2);background:transparent;border-radius:999px;padding:3px 11px;color:#cfc4c2}
.parts button[aria-pressed="true"]{border-color:var(--gold);color:#fff;background:rgba(217,178,90,.18)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:rgba(242,236,234,.1);color:#f2ecea;flex:0 0 auto}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-pressed="true"]{background:var(--gold);color:#1b1a14}
.controls .main-btn{width:60px;height:60px;background:var(--gold);color:#1b1a14}
.controls .main-btn svg{width:30px;height:30px}
.controls .nav-btn{width:48px;height:48px}
/* kolejność w pionie: lektor, muzyka | wstecz, start, dalej | napisy, ustawienia */
#bVoice{order:1}#bMusic{order:2}#bPrev{order:3;margin-left:6px}#bPlay{order:4}#bNext{order:5;margin-right:6px}#bCC{order:6}#bSettings{order:7}
.brk{display:none}

/* warstwy sceny: obraz zawsze w całości + różaniec */
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#rosary{padding:2%}
.ray{transition:opacity .9s;mix-blend-mode:screen}
#rayLabels{pointer-events:none;overflow:visible}
.ray-label{transition:opacity .9s}
.ray-label text{font-family:var(--sans);font-weight:700;letter-spacing:.02em;paint-order:stroke;stroke:rgba(25,14,15,.85);stroke-width:6px;stroke-linejoin:round}
.bead{cursor:pointer;transition:fill .35s;stroke:rgba(25,14,15,.55);stroke-width:1}
.bead-small{fill:url(#gPearl)}
.bead-large,.bead-medal{fill:url(#gPearlL)}
.bead.done{fill:url(#gGold)}
.bead.now{fill:#fff8e2;filter:url(#fGlow)}
.pulse{fill:none;stroke:#fff3cc;stroke-width:2;opacity:0;pointer-events:none}
.pulse.on{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:8;opacity:.9}100%{r:22;opacity:0}}
.cross{fill:url(#gGold)}
.cross.now{filter:url(#fGlow);fill:#fff4d0}

.caption[hidden]{display:none}
.cap-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap-title{font-weight:700;font-size:.93rem;color:var(--ink-2)}
.chip{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.white{background:rgba(240,244,255,.92);color:#2a2230;border-color:transparent}
.chip.red{background:var(--blood);color:#fff;border-color:transparent}
.prayer{font-family:var(--serif);font-size:1.12rem;line-height:1.55;margin:6px 0 0;max-width:62ch}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.count{font-size:.84rem;color:var(--ink-2);margin-top:5px}

/* ---------- układ: poziom (telefon i komputer) ---------- */
@media (orientation: landscape){
  .app{grid-template-columns:minmax(200px,25%) minmax(0,1fr) minmax(240px,30%);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"head stage cap" ". stage cap" "ctrl stage cap"}
  header{align-content:flex-start;padding:10px 10px 4px}
  .brand{flex:1 1 100%}
  .parts{flex-wrap:wrap;overflow:visible}
  .caption{margin:10px;max-height:calc(100% - 20px);align-self:start}
  .controls{flex-wrap:wrap;gap:8px;padding:6px 10px 10px}
  .brk{display:block;flex-basis:100%;height:0;order:4}
  #bPrev{order:1;margin:0}#bPlay{order:2}#bNext{order:3;margin:0}#bVoice{order:5}#bMusic{order:6}#bCC{order:7}#bSettings{order:8}
  .prayer{font-size:1.15rem}
}
/* niski ekran w poziomie (telefon) */
@media (orientation: landscape) and (max-height: 500px){
  body{font-size:15px}
  .brand{font-size:1.05rem}
  header{gap:5px 6px}
  .seg button{padding:4px 10px}
  .parts button{padding:2px 9px;font-size:.88rem}
  .icon-btn{width:36px;height:36px}
  .controls .main-btn{width:50px;height:50px}
  .controls .nav-btn{width:42px;height:42px}
  .caption{margin:6px;padding:8px 12px}
  .prayer{font-size:1.02rem;line-height:1.45}
}
@media (max-width: 420px){ .seg button{padding:5px 10px} .brand{font-size:1.05rem} header{gap:6px} }
/* bardzo niski telefon w pionie */
@media (orientation: portrait) and (max-height: 640px){
  .caption{max-height:20vh}
  .prayer{font-size:1rem}
  .controls .main-btn{width:52px;height:52px}
}

/* ---------- arkusze ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(10,6,6,.55);display:none;z-index:40}
.sheet-back.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);color:var(--ink);border-radius:22px 22px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .3s ease;max-width:560px;margin:0 auto;border:1px solid var(--line);backdrop-filter:blur(8px)}
.sheet.open{transform:none}
@media (orientation: landscape){ .sheet{max-height:92%} }
.sheet h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:4px 0 10px}
.sheet h3{font-size:1rem;margin:16px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row label{flex:1}
.row input[type=range]{width:48%;accent-color:var(--gold)}
.row select{max-width:55%;background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:6px 8px}
.switch{appearance:none;width:46px;height:26px;border-radius:13px;background:var(--btn);position:relative;flex:0 0 auto;cursor:pointer;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .2s}
.switch:checked{background:var(--gold)}
.switch:checked::after{transform:translateX(20px);background:#1b1a14}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--btn);color:var(--btn-ink);font-weight:500}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
.dl{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--btn);color:var(--btn-ink);border-radius:16px;padding:14px;margin:8px 0}
.dl svg{width:34px;height:34px;flex:0 0 auto}
.dl b{display:block;font-size:1.05rem}
.dl span{font-size:.88rem;color:var(--ink-2)}
.dl.apk svg{color:#5fb86c}.dl.pwa svg{color:var(--gold)}
.muted{color:var(--ink-2);font-size:.88rem}
.note{font-size:.9rem;color:var(--ink-2);line-height:1.45}
.note ol{padding-left:1.2em;margin:6px 0}

#tip{position:fixed;z-index:60;pointer-events:none;background:#140e0f;color:#f3efe6;font-size:.82rem;padding:6px 10px;border-radius:8px;max-width:240px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#tip.show{opacity:1;transform:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#140e0f;color:#f3efe6;padding:8px 14px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .25s;z-index:70;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .pulse.on{animation:none;opacity:.6} *{transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>

  <symbol id="i-music" viewBox="0 0 24 24"><path fill="currentColor" d="M9 17.5a2.5 2.5 0 1 1-2-2.45V5l11-2v11.5a2.5 2.5 0 1 1-2-2.45V6.2L9 7.5z"/></symbol>

  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7 7 0 0 1-1.8 1l-.3 2h-4l-.3-2a7 7 0 0 1-1.8-1l-1.9.7-2-3.4 1.6-1.2a7 7 0 0 1 0-2.1L3 10.2l2-3.4 1.9.7a7 7 0 0 1 1.8-1l.3-2h4l.3 2a7 7 0 0 1 1.8 1l1.9-.7 2 3.4-1.6 1.2a7 7 0 0 1 0 2.1z"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-android" viewBox="0 0 24 24"><path fill="currentColor" d="M6 9h12v8a1.5 1.5 0 0 1-1.5 1.5H16V21a1.2 1.2 0 0 1-2.4 0v-2.5h-3.2V21A1.2 1.2 0 0 1 8 21v-2.5h-.5A1.5 1.5 0 0 1 6 17zM3.5 9.5a1.2 1.2 0 0 1 2.4 0v5a1.2 1.2 0 0 1-2.4 0zm14.6 0a1.2 1.2 0 0 1 2.4 0v5a1.2 1.2 0 0 1-2.4 0zM6.2 8a6 6 0 0 1 3-4.4l-1-1.7.6-.4 1.1 1.8a6 6 0 0 1 4.3 0l1.1-1.8.6.4-1 1.7a6 6 0 0 1 3 4.4zm3.3-2.4a.7.7 0 1 0 0 1.4.7.7 0 0 0 0-1.4zm5 0a.7.7 0 1 0 0 1.4.7.7 0 0 0 0-1.4z"/></symbol>

</svg>

<div class="app">
  <header>
    <div class="brand">Jezu, ufam Tobie</div>
    <div class="seg" role="group" aria-label="Rodzaj modlitwy">
      <button id="mKoronka" aria-pressed="true" data-tip="Koronka do Miłosierdzia Bożego: 5 dziesiątków, na koniec po 3 razy „Święty Boże”, „O Krwi i Wodo” i „Jezu, ufam Tobie”">Koronka</button>
      <button id="mRoza" aria-pressed="false" data-tip="Różaniec: wybierz część tajemnic">Różaniec</button>
    </div>
    <button class="icon-btn" id="bDownload" data-tip="Pobierz aplikację: APK na Androida albo instalacja PWA" aria-label="Pobierz aplikację"><svg><use href="#i-dl"/></svg></button>
    <div class="parts" id="parts" hidden role="group" aria-label="Część Różańca">
      <button data-part="radosne" data-tip="Tajemnice radosne: poniedziałek i sobota">Radosne</button>
      <button data-part="swiatla" data-tip="Tajemnice światła: czwartek">Światła</button>
      <button data-part="bolesne" data-tip="Tajemnice bolesne: wtorek i piątek">Bolesne</button>
      <button data-part="chwalebne" data-tip="Tajemnice chwalebne: środa i niedziela">Chwalebne</button>
    </div>
  </header>

  <div class="stage" id="stage" data-tip="Przesuń palcem w lewo lub w prawo albo stuknij w paciorek, aby przejść dalej">
    <svg id="painting" class="layer" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <svg id="rosary" class="layer" viewBox="0 0 400 350" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Różaniec w kształcie serca na tle obrazu Jezusa Miłosiernego"></svg>
    <svg id="rayLabels" class="layer" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  </div>

  <section class="caption" id="caption" aria-live="polite">
    <div class="cap-top"><span class="cap-title" id="capTitle"></span><span class="chip" id="capRay" hidden></span></div>
    <p class="prayer" id="capText"></p>
    <div class="progress"><i id="progBar"></i></div>
    <div class="count" id="capCount"></div>
  </section>

  <nav class="controls" aria-label="Sterowanie modlitwą">
    <button class="icon-btn" id="bVoice" aria-pressed="false" data-tip="Lektor AI: czyta modlitwę na głos" aria-label="Lektor"><svg><use href="#i-voice"/></svg></button>
    <button class="icon-btn" id="bMusic" aria-pressed="false" data-tip="Muzyka medytacyjna w tle" aria-label="Muzyka"><svg><use href="#i-music"/></svg></button>
    <button class="icon-btn nav-btn" id="bPrev" data-tip="Poprzednia modlitwa (strzałka w lewo)" aria-label="Wstecz"><svg><use href="#i-prev"/></svg></button>
    <button class="icon-btn main-btn" id="bPlay" data-tip="Tryb automatyczny: modlitwa postępuje sama (spacja)" aria-label="Start"><svg><use href="#i-play"/></svg></button>
    <button class="icon-btn nav-btn" id="bNext" data-tip="Następna modlitwa (strzałka w prawo)" aria-label="Dalej"><svg><use href="#i-next"/></svg></button>
    <span class="brk"></span>
    <button class="icon-btn" id="bCC" aria-pressed="true" data-tip="Pokaż lub ukryj tekst modlitwy" aria-label="Napisy"><svg><use href="#i-cc"/></svg></button>
    <button class="icon-btn" id="bSettings" data-tip="Ustawienia: głos, tempo, muzyka, wygląd" aria-label="Ustawienia"><svg><use href="#i-gear"/></svg></button>
  </nav>
</div>

<div class="sheet-back" id="back"></div>

<section class="sheet" id="sSettings" role="dialog" aria-modal="true" aria-label="Ustawienia">
  <h2>Ustawienia</h2>
  <h3>Lektor</h3>
  <div class="row"><label for="tVoice">Czytaj modlitwę na głos</label><input type="checkbox" class="switch" id="tVoice"></div>
  <div class="row"><label for="selVoice">Głos</label><select id="selVoice" data-tip="Dostępne głosy polskie zależą od urządzenia"></select></div>
  <div class="row"><label for="rRate">Tempo</label><input type="range" id="rRate" min="0.6" max="1.4" step="0.05" data-tip="Tempo czytania i trybu automatycznego"></div>
  <h3>Muzyka</h3>
  <div class="row"><label for="tMusic">Muzyka w tle</label><input type="checkbox" class="switch" id="tMusic"></div>
  <div class="row"><label for="rVol">Głośność</label><input type="range" id="rVol" min="0" max="1" step="0.02"></div>
  <h3>Wygląd</h3>
  <div class="row"><label for="selTheme">Panele</label><select id="selTheme"><option value="auto">Jak w systemie</option><option value="dark">Ciemne</option><option value="light">Jasne</option></select></div>
  <p class="muted" id="ver"></p>
  <div class="btn-row"><button class="btn" data-close>Zamknij</button></div>
</section>

<section class="sheet" id="sDownload" role="dialog" aria-modal="true" aria-label="Pobierz aplikację">
  <h2>Zainstaluj aplikację</h2>
  <button class="dl apk" id="bApk" data-tip="Pobiera plik instalacyjny .apk dla Androida"><svg><use href="#i-android"/></svg><div><b>Pobierz aplikację natywną (APK)</b><span>Android, instalacja z pliku</span></div></button>
  <button class="dl pwa" id="bPwa" data-tip="Dodaje aplikację do ekranu głównego; działa offline"><svg><use href="#i-pwa"/></svg><div><b>Pobierz aplikację PWA</b><span>Android, iPhone, komputer; bez sklepu</span></div></button>
  <div class="note" id="dlNote"></div>
  <div class="btn-row"><button class="btn" data-close>Zamknij</button></div>
</section>

<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ===== Konfiguracja ===== */
const APP_VERSION = "1.5.0";
const CONFIG = {
  bgUrl: "img/jezu-milosierny.webp",   // obraz Jezusa Miłosiernego (zawsze w całości)
  bgSize: [482, 1051],                 // wymiary obrazu w pikselach
  heart: [254, 314],                   // Serce Jezusa na obrazie (źródło promieni), px
  apkUrl: "download/milosierdzie.apk"
};

/* ===== Geometria różańca (układ 400×350) =====
   Serce z paciorków; z górnego zwężenia serca (medalik) na środku
   zwisa w dół łańcuszek: duży, 3 małe, duży paciorek i krzyżyk. */
const RV_W = 400, RV_H = 350, CX = 200, CY = 145, S = 11;
function heartXY(t){
  const X = 16*Math.pow(Math.sin(t),3);
  const Y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return [CX + S*X, CY - S*Y];
}
// od zwężenia (t=0) w lewo, dookoła serca
const dense = []; { const N = 2400; for(let i=0;i<=N;i++) dense.push(heartXY(-2*Math.PI*i/N)); }
const cum = [0]; for(let i=1;i<dense.length;i++){ const a=dense[i-1], b=dense[i]; cum.push(cum[i-1] + Math.hypot(b[0]-a[0], b[1]-a[1])); }
const TOTAL = cum[cum.length-1];
function atLen(d){ let lo=0, hi=cum.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(cum[m]<d) lo=m; else hi=m; } return dense[hi]; }

const BEADS = {};
const notch = dense[0];                          // górne zwężenie serca
BEADS.m = {x:notch[0], y:notch[1], type:"medal"};
// 27 paciorków na lewej połowie, prawa to lustro; żaden nie stoi na ostrym czubku ani przy medaliku,
// więc paciorki 27 i 28 (dół serca) oraz 1 i 54 (przy medaliku) leżą obok siebie, nie na sobie
{
  const AXIS = 5.8 + 4, lenOk = i => CX - dense[i][0] >= AXIS;
  let a0 = 0, a1 = 0;
  for(let i=1;i<dense.length;i++) if(lenOk(i) && Math.hypot(dense[i][0]-notch[0], dense[i][1]-notch[1]) >= 10+5.8+4){ a0 = cum[i]; break; }
  for(let i=0;i<dense.length && cum[i]<=TOTAL/2;i++) if(lenOk(i)) a1 = cum[i];
  for(let k=1;k<=27;k++){
    const p = atLen(a0 + (a1-a0)*(k-1)/26);
    BEADS["r"+k] = {x:p[0], y:p[1], type:(k%11===0)?"large":"small"};
    BEADS["r"+(55-k)] = {x:2*CX-p[0], y:p[1], type:((55-k)%11===0)?"large":"small"};
  }
}
const CHAIN = ["cL1","c3","c2","c1","cL0","cross"], GAP = 32;
CHAIN.forEach((id,i)=>{ BEADS[id] = {x:notch[0], y:notch[1] + GAP*(i+1) + (id==="cross"?4:0), type: id==="cross"?"cross":(id.startsWith("cL")?"large":"small")}; });
const ofBead = d => d===0 ? "cL1" : "r"+(d*11);
const smallBead = (d,j) => "r"+(d*11 + j + 1);

function buildKoronka(){
  const s = [];
  s.push({b:"cross", t:"Znak krzyża", x:P.znak, d:-1});
  s.push({b:"cL0", t:"Ojcze nasz", x:P.ojcze, d:-1});
  s.push({b:"c1", t:"Zdrowaś Maryjo", x:P.zdrowas, d:-1});
  s.push({b:"c2", t:"Wierzę w Boga", x:P.wierze, d:-1});
  for(let d=0; d<5; d++){
    s.push({b:ofBead(d), t:`Dziesiątek ${ORD_D[d]}`, x:P.przedwieczny, d, n:0});
    for(let j=0;j<10;j++) s.push({b:smallBead(d,j), t:`Dziesiątek ${ORD_D[d]}`, x:P.dlaJego, d, n:j+1});
  }
  for(let i=1;i<=3;i++) s.push({b:"m", t:`Na zakończenie: Święty Boże (${i} z 3)`, x:P.swiety, d:5});
  for(let i=1;i<=3;i++) s.push({b:"m", t:`Na zakończenie: O Krwi i Wodo (${i} z 3)`, x:P.okrwi, d:5});
  for(let i=1;i<=3;i++) s.push({b:"m", t:`Na zakończenie: Jezu, ufam Tobie (${i} z 3)`, x:P.ufam, d:5});
  return s;
}
function buildRozaniec(part){
  const M = MYST[part], s = [];
  s.push({b:"cross", t:"Znak krzyża", x:P.znak, d:-1});
  s.push({b:"cross", t:"Wierzę w Boga", x:P.wierze, d:-1});
  s.push({b:"cL0", t:"Ojcze nasz", x:P.ojcze, d:-1});
  ["o pomnożenie wiary","o umocnienie nadziei","o rozpalenie miłości"].forEach((intent,i)=>
    s.push({b:"c"+(i+1), t:`Zdrowaś Maryjo, ${intent}`, x:P.zdrowas, d:-1}));
  s.push({b:"cL1", t:"Chwała Ojcu", x:P.chwala, d:-1});
  for(let d=0; d<5; d++){
    const title = `Tajemnica ${ORD[d]}: ${M.items[d]}`;
    s.push({b:ofBead(d), t:`Tajemnice ${M.name}`, x:title, d, n:0, ann:true});
    s.push({b:ofBead(d), t:title, x:P.ojcze, d, n:0});
    for(let j=0;j<10;j++) s.push({b:smallBead(d,j), t:title, x:P.zdrowas, d, n:j+1});
    const endB = d<4 ? ofBead(d+1) : "m";
    s.push({b:endB, t:title, x:P.chwala, d, n:10});
    s.push({b:endB, t:title, x:P.fatima, d, n:10});
  }
  s.push({b:"m", t:"Zakończenie", x:P.witaj, d:5});
  s.push({b:"m", t:"Znak krzyża", x:P.znak, d:5});
  return s;
}

  const labels = $("rayLabels"); labels.setAttribute("viewBox", `0 0 ${W} ${H}`); labels.innerHTML = "";
  const L = 820, rays = svg.querySelector("#rays");
  SAC.forEach((sac,i)=>{
    const tr = `translate(${hx} ${hy}) rotate(${RAY_ANGLE[i]})`;
    const g = el("g", {class:"ray", id:"ray"+i, transform:tr, opacity:0}, rays);
    const grad = sac.c==="white" ? "gRayW" : "gRayR";
    el("path", {d:`M-4 0 L4 0 L48 ${L} L-48 ${L} Z`, fill:`url(#${grad})`, filter:"url(#fSoft)"}, g);
    el("path", {d:`M-2 0 L2 0 L18 ${L*.75} L-18 ${L*.75} Z`, fill:`url(#${grad})`}, g);
    // napis na osi promienia, czytany od lewej do prawej
    const lg = el("g", {class:"ray-label", id:"rayT"+i, transform:tr, opacity:0}, labels);
    const flip = RAY_ANGLE[i] > 0, R = RAY_TEXT[i], n = R.lines.length, d = R.y0 / Math.cos(RAY_ANGLE[i]*Math.PI/180);
    const t = el("text", {transform:`rotate(${flip ? -90 : 90})`, "text-anchor":flip ? "end" : "start", "dominant-baseline":"central",
      "font-size":R.f, fill:sac.c==="white" ? "#ffffff" : "#ffe1e1"}, lg);
    R.lines.forEach((line,k)=>{ el("tspan", {x:(flip ? -1 : 1)*d, y:(k-(n-1)/2)*1.05*R.f}, t).textContent = line; });
  });
}

      continue;

}

/* ===== Render stanu ===== */
function rebuild(){
  stopAuto();
  steps = st.mode==="koronka" ? buildKoronka() : buildRozaniec(st.part);
  idx = 0;
  $("mKoronka").setAttribute("aria-pressed", st.mode==="koronka");
  $("mRoza").setAttribute("aria-pressed", st.mode==="rozaniec");
  $("parts").hidden = st.mode!=="rozaniec";
  document.querySelectorAll("#parts button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.part===st.part));
  render();
}
function render(){
  const s = steps[idx];
  const doneBeads = new Set(); for(let i=0;i<idx;i++) doneBeads.add(steps[i].b);
  document.querySelectorAll("#beads .bead").forEach(e=>{
    const id = e.dataset.bead;
    e.classList.toggle("now", id===s.b);
    e.classList.toggle("done", id!==s.b && doneBeads.has(id));
  });
  const b = BEADS[s.b], pulse = $("pulse");
  pulse.setAttribute("cx", b.x); pulse.setAttribute("cy", b.type==="cross" ? b.y+2 : b.y);
  pulse.classList.add("on");
  // promienie przybywają z każdym dziesiątkiem i zostają do końca modlitwy
  for(let i=0;i<5;i++){
    const on = s.d>=i;
    $("ray"+i).setAttribute("opacity", on ? (s.d===i ? 1 : .85) : 0);
    $("rayT"+i).setAttribute("opacity", on ? 1 : 0);
  }
  $("core").setAttribute("opacity", s.d>=0 ? .9 : 0);
  $("capTitle").textContent = s.t;
  $("capText").textContent = s.x;
  const chip = $("capRay");
  if(s.d>=0 && s.d<5){ const sac = SAC[s.d]; chip.hidden = false; chip.className = "chip "+sac.c; chip.textContent = `Promień ${s.d+1}: ${sac.n}`; }
  else if(s.d===5){ chip.hidden = false; chip.className = "chip"; chip.textContent = "Wszystkie promienie łaski"; }
  else chip.hidden = true;
  $("progBar").style.width = (idx/(steps.length-1)*100)+"%";
  let cnt;
  if(s.d<0) cnt = "Modlitwy wstępne";
  else if(s.d===5) cnt = "Modlitwy końcowe";
  else cnt = `Dziesiątek ${s.d+1} z 5` + (s.n>=1 && s.n<=10 && !s.ann ? `, paciorek ${s.n} z 10` : "");
  $("capCount").textContent = `${cnt}. Krok ${idx+1} z ${steps.length}`;
  $("bPrev").disabled = idx===0;
  $("bNext").disabled = idx===steps.length-1;
}

/* ===== Wersja natywna (APK, Capacitor): lektor i wygaszanie ekranu przez wtyczki Androida ===== */
const Cap = window.Capacitor;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const nativeTTS = isNative ? Cap.registerPlugin("TextToSpeech") : null;
const keepAwake = isNative ? Cap.registerPlugin("KeepAwake") : null;

/* ===== Lektor (Web Speech API; w APK natywny syntezator mowy) ===== */
const synth = window.speechSynthesis || null;
const canSpeak = !!(synth || nativeTTS);
let voices = [];
function loadVoices(){
  if(nativeTTS && !synth){ const sel = $("selVoice"), o = document.createElement("option"); sel.innerHTML = ""; o.value = ""; o.textContent = "Głos systemowy Androida (polski)"; sel.appendChild(o); return; }
  if(!synth) return;
  voices = synth.getVoices().filter(v=>/^pl/i.test(v.lang));
  const sel = $("selVoice"); sel.innerHTML = "";
  if(!voices.length){ const o = document.createElement("option"); o.textContent = "Domyślny głos urządzenia"; o.value=""; sel.appendChild(o); return; }
  const rank = v => (/natural|neural|online/i.test(v.name)?0:/google/i.test(v.name)?1:2);
  voices.sort((a,b)=>rank(a)-rank(b));
  voices.forEach(v=>{ const o = document.createElement("option"); o.value = v.name; o.textContent = v.name; sel.appendChild(o); });
  if(st.voiceName && voices.some(v=>v.name===st.voiceName)) sel.value = st.voiceName; else st.voiceName = voices[0].name;
}
function speakable(s){
  if(s.ann) return s.x;
  return s.x;
}
let speakTok = 0;
function speak(text, cb){
  if(!canSpeak){ cb && cb(); return; }
  const parts = text.split(/(?<=[.!?,;])\s+/).reduce((acc, p)=>{ const l = acc[acc.length-1]; if(l && (l.length+p.length) < 140) acc[acc.length-1] = l+" "+p; else acc.push(p); return acc; }, []);
  let finished = false;
  const done = () => { if(finished) return; finished = true; clearTimeout(guard); cb && cb(); };
  const guard = setTimeout(done, estimate(text)*2.2 + 4000);
  if(!synth){
    // natywnie: kolejne fragmenty po zakończeniu poprzedniego; nowe wywołanie przerywa stare
    const tok = ++speakTok;
    nativeTTS.stop().catch(()=>{}).then(async ()=>{
      for(const p of parts){
        if(tok!==speakTok) return;
        try{ await nativeTTS.speak({text:p, lang:"pl-PL", rate:st.rate, pitch:1, volume:1, queueStrategy:0}); }catch(e){ break; }
      }
      if(tok===speakTok) done();
    });
    return;
  }
  synth.cancel();
  const v = voices.find(x=>x.name===st.voiceName);
  parts.forEach((p,i)=>{
    const u = new SpeechSynthesisUtterance(p);
    u.lang = "pl-PL"; if(v) u.voice = v; u.rate = st.rate; u.pitch = 1;
    if(i===parts.length-1){ u.onend = done; }
    u.onerror = e => { if(e.error!=="interrupted" && e.error!=="canceled") done(); };
    synth.speak(u);
  });
}
function estimate(text){ const w = text.split(/\s+/).length; return Math.max(2200, w*420/st.rate); }
function silence(){ if(synth) synth.cancel(); if(nativeTTS){ speakTok++; nativeTTS.stop().catch(()=>{}); } clearTimeout(timer); }

/* ===== Tryb automatyczny i ręczny ===== */
function runStep(){
  const tok = ++runTok;
  const next = () => {
    if(tok!==runTok || !playing) return;
    if(idx < steps.length-1){ idx++; render(); timer = setTimeout(()=>{ if(tok===runTok && playing) runStep(); }, 500); }
    else { stopAuto(); toast("Amen. Modlitwa zakończona"); }
  };
  const text = speakable(steps[idx]);
  if(st.voice && canSpeak) speak(text, next); else timer = setTimeout(next, estimate(text));
}
let wakeLock = null;
async function startAuto(){
  if(idx===steps.length-1){ idx = 0; render(); }
  playing = true; setPlayIcon(); runStep();
  try{ if(keepAwake) await keepAwake.keepAwake(); else if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function stopAuto(){
  playing = false; runTok++; silence(); setPlayIcon();
  try{ wakeLock && wakeLock.release(); if(keepAwake) keepAwake.allowSleep().catch(()=>{}); }catch(e){} wakeLock = null;
}
function setPlayIcon(){
  const b = $("bPlay");
  b.querySelector("use").setAttribute("href", playing ? "#i-pause" : "#i-play");
  b.setAttribute("aria-label", playing ? "Pauza" : "Start");
  b.dataset.tip = playing ? "Zatrzymaj tryb automatyczny (spacja)" : "Tryb automatyczny: modlitwa postępuje sama (spacja)";
}
function go(n){
  if(n<0 || n>=steps.length) return;
  idx = n; runTok++; silence(); render();
  if(playing) runStep();
  else if(st.voice) speak(speakable(steps[idx]));
}

/* ===== Muzyka medytacyjna (Web Audio, generowana na żywo) ===== */
const Music = {
  ctx:null, master:null, nodes:[], chimeT:null,
  start(){
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC){ toast("Ta przeglądarka nie obsługuje dźwięku"); return false; }
    if(!this.ctx){
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain(); this.master.gain.value = 0; this.master.connect(ctx.destination);
      // pogłos
      const len = ctx.sampleRate*4, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
      this.verb = ctx.createConvolver(); this.verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = .55; this.verb.connect(wet); wet.connect(this.master);
      // plama dźwięku: D – A – D – A – Fis – E
      const filt = ctx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 850; filt.Q.value = .4;
      filt.connect(this.master); filt.connect(this.verb);
      const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = .05; lfoG.gain.value = 320;
      lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start();
      [73.42,110,146.83,220,369.99,329.63].forEach((f,i)=>{
        [-4,4].forEach(det=>{
          const o = ctx.createOscillator(); o.type = i<2 ? "sine" : "triangle"; o.frequency.value = f; o.detune.value = det;
          const g = ctx.createGain(); g.gain.value = (i<2 ? .09 : .035);
          const br = ctx.createOscillator(), brG = ctx.createGain(); br.frequency.value = .03 + i*.013; brG.gain.value = g.gain.value*.6;
          br.connect(brG); brG.connect(g.gain); br.start();
          o.connect(g); g.connect(filt); o.start();
        });
      });
    }
    this.ctx.resume();
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setTargetAtTime(st.vol*.8, this.ctx.currentTime, 1.2);
    this.scheduleChime();
    return true;
  },
  scheduleChime(){
    clearTimeout(this.chimeT);
    this.chimeT = setTimeout(()=>{ this.chime(); this.scheduleChime(); }, 3500 + Math.random()*5000);
  },
  chime(){
    const ctx = this.ctx; if(!ctx || ctx.state!=="running") return;
    const notes = [587.33,659.25,739.99,880,987.77,1174.66];
    const f = notes[Math.floor(Math.random()*notes.length)], t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t+.03); g.gain.exponentialRampToValueAtTime(.0001, t+5);
    o.connect(g); g.connect(this.verb); g.connect(this.master); o.start(t); o.stop(t+5.2);
  },
  stop(){
    clearTimeout(this.chimeT);
    if(!this.ctx) return;
    const t = this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setTargetAtTime(0, t, .6);
    setTimeout(()=>{ if(!st.music && this.ctx) this.ctx.suspend(); }, 2500);
  },
  setVol(v){ if(this.ctx && st.music) this.master.gain.setTargetAtTime(v*.8, this.ctx.currentTime, .2); }
};

/* ===== Przełączniki ===== */
function setVoice(on){
  if(on && !canSpeak){ toast("Ta przeglądarka nie ma syntezy mowy"); on = false; }
  st.voice = on; store.set("voice", on);
  $("bVoice").setAttribute("aria-pressed", on); $("tVoice").checked = on;
  if(!on){ silence(); if(playing){ runTok++; runStep(); } }
  else if(!playing) speak(speakable(steps[idx]));
  else { runTok++; silence(); runStep(); }
}
function setMusic(on){
  if(on && !Music.start()) on = false;
  if(!on) Music.stop();
  st.music = on; $("bMusic").setAttribute("aria-pressed", on); $("tMusic").checked = on;
}
function setCC(on){ st.cc = on; store.set("cc", on); $("caption").hidden = !on; $("bCC").setAttribute("aria-pressed", on); }
function setTheme(t){ st.theme = t; store.set("theme", t); if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; }
function openSheet(id){ closeSheets(); $(id).classList.add("open"); $("back").classList.add("open"); $(id).querySelector("button,input,select").focus({preventScroll:true}); }
function closeSheets(){ document.querySelectorAll(".sheet.open").forEach(s=>s.classList.remove("open")); $("back").classList.remove("open"); }

/* ===== Instalacja: APK i PWA ===== */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener("appinstalled", () => { deferredPrompt = null; toast("Aplikacja zainstalowana"); });
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;

async function downloadApk(){
  const note = $("dlNote");
  try{
    const r = await fetch(CONFIG.apkUrl, {method:"HEAD", cache:"no-store"});
    const type = r.headers.get("content-type") || "";
    if(r.ok && !/text\/html/i.test(type)){
      const a = document.createElement("a"); a.href = CONFIG.apkUrl; a.download = "milosierdzie.apk"; document.body.appendChild(a); a.click(); a.remove();
      note.innerHTML = "<p>Pobieranie rozpoczęte. Po pobraniu otwórz plik i zezwól na instalację z tego źródła.</p>";
      return;
    }
  }catch(e){}
  note.innerHTML = "<p>Plik APK nie jest jeszcze umieszczony na tym serwerze. Zainstaluj wersję PWA przyciskiem poniżej albo wróć później.</p>";
}
async function installPwa(){
  const note = $("dlNote");
  if(isStandalone){ note.innerHTML = "<p>Aplikacja jest już zainstalowana i działa w trybie PWA.</p>"; return; }
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice; deferredPrompt = null;
    note.innerHTML = r.outcome==="accepted" ? "<p>Instalacja rozpoczęta. Ikona pojawi się na ekranie głównym.</p>" : "<p>Instalacja anulowana. Możesz ją ponowić w każdej chwili.</p>";
    return;
  }
  if(isIOS){
    note.innerHTML = "<p>Na iPhonie i iPadzie:</p><ol><li>Otwórz stronę w Safari.</li><li>Stuknij Udostępnij.</li><li>Wybierz Do ekranu początkowego.</li></ol>";
  } else {
    note.innerHTML = "<p>Przeglądarka nie zaproponowała instalacji automatycznie. Otwórz menu przeglądarki (⋮) i wybierz Zainstaluj aplikację lub Dodaj do ekranu głównego.</p>";
  }
}

/* ===== Podpowiedzi (tooltip) ===== */
const tipEl = $("tip"); let tipTimer = null, pressTimer = null;
function showTip(target){
  const text = target.dataset.tip; if(!text) return;
  tipEl.textContent = text; tipEl.classList.add("show");
  const r = target.getBoundingClientRect(), tr = tipEl.getBoundingClientRect();
  let x = r.left + r.width/2 - tr.width/2, y = r.top - tr.height - 8;
  if(target.id==="stage"){ y = r.top + 8; }
  if(y < 6) y = r.bottom + 8;
  x = Math.max(6, Math.min(x, innerWidth - tr.width - 6));
  tipEl.style.left = x+"px"; tipEl.style.top = y+"px";
}
function hideTip(){ tipEl.classList.remove("show"); clearTimeout(tipTimer); }
document.addEventListener("pointerover", e => {
  if(e.pointerType==="touch") return;
  const t = e.target.closest("[data-tip]"); if(!t) return;
  clearTimeout(tipTimer); tipTimer = setTimeout(()=>showTip(t), t.id==="stage" ? 1200 : 350);
});
document.addEventListener("pointerout", e => { if(e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if(t && t.matches(":focus-visible")) showTip(t); });
document.addEventListener("focusout", hideTip);
document.addEventListener("touchstart", e => {
  const t = e.target.closest("[data-tip]"); if(!t || t.id==="stage") return;
  clearTimeout(pressTimer); pressTimer = setTimeout(()=>{ showTip(t); setTimeout(hideTip, 2200); }, 550);
}, {passive:true});
document.addEventListener("touchend", ()=>clearTimeout(pressTimer), {passive:true});

/* ===== Toast ===== */
let toastT = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2400); }

/* ===== Zdarzenia ===== */
$("mKoronka").onclick = () => { st.mode = "koronka"; store.set("mode","koronka"); rebuild(); };
$("mRoza").onclick = () => { st.mode = "rozaniec"; store.set("mode","rozaniec"); rebuild(); };
document.querySelectorAll("#parts button").forEach(b => b.onclick = () => { st.part = b.dataset.part; store.set("part", st.part); rebuild(); });
$("bPrev").onclick = () => go(idx-1);
$("bNext").onclick = () => go(idx+1);
$("bPlay").onclick = () => playing ? stopAuto() : startAuto();
$("bVoice").onclick = () => setVoice(!st.voice);
$("bMusic").onclick = () => setMusic(!st.music);
$("bCC").onclick = () => setCC(!st.cc);
$("bSettings").onclick = () => openSheet("sSettings");
$("bDownload").onclick = () => { $("dlNote").innerHTML = ""; openSheet("sDownload"); };
$("back").onclick = closeSheets;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheets);
$("tVoice").onchange = e => setVoice(e.target.checked);
$("tMusic").onchange = e => setMusic(e.target.checked);
$("selVoice").onchange = e => { st.voiceName = e.target.value; store.set("voiceName", st.voiceName); if(st.voice && !playing) speak(P.ufam); };
$("rRate").oninput = e => { st.rate = +e.target.value; store.set("rate", st.rate); };
$("rVol").oninput = e => { st.vol = +e.target.value; store.set("vol", st.vol); Music.setVol(st.vol); };
$("selTheme").onchange = e => setTheme(e.target.value);
$("bApk").onclick = downloadApk;
$("bPwa").onclick = installPwa;

const stage = $("stage"); let sx = 0, sy = 0, st0 = 0;
stage.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; st0 = Date.now(); });
stage.addEventListener("pointerup", e => {
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.2){ go(idx + (dx<0 ? 1 : -1)); return; }
  if(Math.abs(dx) < 10 && Math.abs(dy) < 10 && Date.now()-st0 < 500){
    const bead = e.target.closest("[data-bead]");
    if(bead){ const i = steps.findIndex(s=>s.b===bead.dataset.bead); if(i>=0) go(i); return; }
    const r = stage.getBoundingClientRect(), rel = (e.clientX - r.left)/r.width;
    if(rel > .75) go(idx+1); else if(rel < .25) go(idx-1);
  }
});
document.addEventListener("keydown", e => {
  if(e.target.matches("input,select,textarea")) return;
  if(e.key==="Escape") return closeSheets();
  if(document.querySelector(".sheet.open")) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); go(idx+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); go(idx-1); }
  else if(e.key===" "){ e.preventDefault(); playing ? stopAuto() : startAuto(); }
});
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && playing && "wakeLock" in navigator){ navigator.wakeLock.request("screen").then(w=>wakeLock=w).catch(()=>{}); } });
window.addEventListener("orientationchange", () => { hideTip(); closeSheets(); });

/* ===== Start ===== */
setTheme(st.theme); $("selTheme").value = st.theme;
drawPainting(); drawRosary();
$("rRate").value = st.rate; $("rVol").value = st.vol;
$("tVoice").checked = st.voice; $("bVoice").setAttribute("aria-pressed", st.voice);
setCC(st.cc);
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; } else if(nativeTTS) loadVoices();
if(isNative) $("bDownload").style.display = "none";   // w aplikacji natywnej przycisk pobierania jest zbędny
$("ver").textContent = "Wersja " + APP_VERSION + ".";
rebuild();

if(!isNative && "serviceWorker" in navigator && location.protocol==="https:" && !/claude|anthropic/i.test(location.hostname)){
  navigator.serviceWorker.register("sw.js?v="+APP_VERSION).catch(()=>{});
}
</script>
